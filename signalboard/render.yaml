# Render Blueprint: New > Blueprint > pick this repo.
# Secrets marked sync:false are asked for in the Render dashboard.
# DATABASE_URL points to a Neon Postgres (free tier does not expire,
# unlike Render's free Postgres which is deleted after 30 + 14 days).
services:
  - type: web
    name: signalboard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: EMAIL_PROVIDER
        value: postmark
      - key: POSTMARKAPP_TOKEN
        sync: false
      - key: POSTMARK_FROM_EMAIL
        sync: false
      - key: ONESIGNAL_APP_ID
        sync: false
      - key: ONESIGNAL_REST_API_KEY
        sync: false
